    <script>
      // Per AI Studio constraints: HMR is disabled, ignore WebSocket connection errors
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String((e && (e.reason && e.reason.message || e.reason)) || '');
        if (str.includes('WebSocket') || str.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
